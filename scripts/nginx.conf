# 股票量能分析系统 Nginx配置

# 后端API反向代理
upstream backend_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name 43.163.87.9;  # 或你的域名

    # 日志配置
    access_log /var/www/stock-discipline/logs/nginx_access.log;
    error_log /var/www/stock-discipline/logs/nginx_error.log;

    # 前端静态文件
    root /var/www/stock-discipline/frontend/dist;
    index index.html;

    # API路由（所有/api/请求转发到后端）
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 前端路由（Vue SPA）
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 安全配置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}